# Companies to track. Token = last path segment of the public board URL:
#   greenhouse: boards.greenhouse.io/<token>  or  job-boards.greenhouse.io/<token>
#   lever:      jobs.lever.co/<token>
#   ashby:      jobs.ashbyhq.com/<token>
# "verified" = board confirmed to exist on 2026-10-19. Everything added 2026-10-25 was verified
