seeds:
  - name: role_rules
    description: Title patterns per role. The lowest role_order that matches wins, so specific roles go before general ones.
    config:
      column_types: {role_order: integer, role: varchar, pattern: varchar}
  - name: title_excludes
    description: Titles matching any of these are never given a role, whatever else they contain.
    config:
      column_types: {reason: varchar, pattern: varchar}
  - name: entry_level_rules
    description: A tech title is entry level if it matches an include pattern and no exclude pattern.
    config:
      column_types: {kind: varchar, pattern: varchar}
    columns:
      - name: kind
        data_tests:
          - accepted_values:
              arguments:
                values: [include, exclude]
  - name: skills
    description: "Skill dictionary (RE2 regex, no lookahead). vendor_token: that company's own postings don't count as demand for its product."
    config:
      column_types: {skill: varchar, category: varchar, vendor_token: varchar, pattern: varchar}
    columns:
      - name: skill
        data_tests: [not_null, unique]
  - name: companies
    description: Generated by scripts/companies_to_seed.py from config/companies.yaml.
    config:
      column_types: {company_token: varchar, company_name: varchar, ats: varchar}
    columns:
      - name: company_token
        data_tests: [not_null, unique]
